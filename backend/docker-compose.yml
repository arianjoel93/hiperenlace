
services:

  mysql-db:
    image: mysql:8.1
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: shop-db
    volumes:
      - ./mysql:/var/lib/mysql
    ports:
      - 3307:3306

